
name: Build NutriSport APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Verificar Capacitor
        run: npx cap --version

      - name: Crear proyecto Android si no existe
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Copiar iconos de NutriSport
        run: |
          if [ -d "android-icon" ]; then
            echo "Copiando iconos..."
            cp -r android-icon/* android/app/src/main/res/
          else
            echo "No existe android-icon"
          fi

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Construir APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: No se genero la APK"
            exit 1
          fi

          echo "APK generada correctamente"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK NutriSport
        uses: actions/upload-artifact@v4
        with:
          name: NutriSport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```
