name: Build TablasPro / NutriSport APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android (si no existe)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Copiar iconos PRO
        run: |
          if [ -d "android-icon" ]; then
            echo "Copiando iconos..."
            cp -r android-icon/* android/app/src/main/res/
          fi
          ls -la android/app/src/main/res/mipmap-xxxhdpi/

      - name: Verificar estructura
        run: |
          ls -la
          ls -la android/
          ls -la android/app/build.gradle || echo "no build.gradle"

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Construir APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TablasPro-APK-PRO-ICONS
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
